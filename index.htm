<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eldad the Calculus</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <div class="stars"></div>
    <div class="container">
        <header>
            <h1>CALCULUS MISSION CONTROL</h1>
            <p class="subtitle">Unit: Differential Calculus 1-4</p>
        </header>

        <main id="quiz-container">
            <div id="question-box">
                <h2 id="question-text">Loading calculation...</h2>
                <div id="options-container"></div>
            </div>

            <button id="next-btn" class="hidden">Next Objective</button>

            <div id="explanation-box" class="hidden">
                <h3><span class="icon">🚀</span> Post-Flight Analysis</h3>
                <div id="explanation-text"></div>
            </div>
        </main>

        <footer>
            <div class="status-bar">SYSTEM STATUS: <span class="online">ONLINE</span></div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
